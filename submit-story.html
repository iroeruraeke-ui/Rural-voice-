<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Share a Story — Rural Voice</title><link rel="stylesheet" href="assets/style.css"></head><body><header><a class="brand" href="index.html"><span>RV</span><b>Rural Voice<small>Giving rural communities a voice</small></b></a></header><main class="page narrow"><p class="eyebrow">COMMUNITY SUBMISSIONS</p><h1>Share a story from your community</h1><p class="lead">Tell us about a local issue, achievement or possible solution. Submissions should be verified before publication.</p><form id="story-form"><label>Your name<input name="name" required maxlength="120"></label><label>Email<input name="email" type="email" maxlength="200"></label><label>Community / location<input name="location" required maxlength="200"></label><label>Topic<select name="category"><option>Agriculture</option><option>Education</option><option>Health</option><option>Infrastructure</option><option>Environment</option><option>Community</option><option>Government</option><option>Other</option></select></label><label>Story title<input name="title" required maxlength="200"></label><label>Story details<textarea name="content" required rows="8" maxlength="12000"></textarea></label><label><input type="checkbox" required> I have the right to share this information and understand it may be reviewed.</label><button class="button">Submit for review</button><p id="story-status">Story submissions need a secure review workflow before being enabled.</p></form></main><footer><a href="index.html">← Home</a></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/site.js"></script></body></html>
